<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>延世韩国语 - 高音质词汇点读小站</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --text-main: #333333;
      --text-sub: #7f8c8d;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    p.tips {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin: 0;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }

    .word-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .word-card:active {
      transform: scale(0.96);
      background-color: #eaf4fb;
    }

    .kr-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .cn-text {
      font-size: 0.95rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <h1>延世韩国语 - 词汇点读小站</h1>
    <p class="tips">💡 点击下方任意卡片即可发音（建议使用 Edge 或 Chrome 浏览器）</p>
  </header>

  <!-- 词汇卡片展示区 -->
  <main class="word-grid">
    <div class="word-card" onclick="speakKorean('안녕하세요')">
      <div class="kr-text">안녕하세요</div>
      <div class="cn-text">你好</div>
    </div>

    <div class="word-card" onclick="speakKorean('감사합니다')">
      <div class="kr-text">감사합니다</div>
      <div class="cn-text">谢谢</div>
    </div>

    <div class="word-card" onclick="speakKorean('선생님')">
      <div class="kr-text">선생님</div>
      <div class="cn-text">老师</div>
    </div>

    <div class="word-card" onclick="speakKorean('학생')">
      <div class="kr-text">학생</div>
      <div class="cn-text">学生</div>
    </div>

    <div class="word-card" onclick="speakKorean('한국어')">
      <div class="kr-text">한국어</div>
      <div class="cn-text">韩国语</div>
    </div>

    <div class="word-card" onclick="speakKorean('공부하다')">
      <div class="kr-text">공부하다</div>
      <div class="cn-text">学习</div>
    </div>
  </main>

  <script>
    // 全局语音变量与声音初始化
    let selectedKoreanVoice = null;

    function initKoreanVoice() {
      if (!('speechSynthesis' in window)) return;
      
      const voices = window.speechSynthesis.getVoices();
      
      // 优先匹配高品质神经网络音色 (Neural / Natural / Online)
      selectedKoreanVoice = voices.find(voice => 
        (voice.lang === 'ko-KR' || voice.lang === 'ko_KR' || voice.lang.startsWith('ko')) && 
        (voice.name.includes('Neural') || voice.name.includes('Natural') || voice.name.includes('Online'))
      ) || voices.find(voice => voice.lang.startsWith('ko'));
    }

    // 处理浏览器异步加载语音列表
    if ('speechSynthesis' in window) {
      initKoreanVoice();
      window.speechSynthesis.onvoiceschanged = initKoreanVoice;
    }

    // 点读发音核心逻辑
    function speakKorean(text) {
      if (!('speechSynthesis' in window)) {
        alert("您的浏览器暂不支持朗读功能，建议更换 Chrome 或 Edge 浏览器。");
        return;
      }

      // 停止当前正在播放的声音
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.85; // 语速微调至 0.85，发音清晰自然
      utterance.pitch = 1.0;

      if (!selectedKoreanVoice) {
        initKoreanVoice();
      }
      
      if (selectedKoreanVoice) {
        utterance.voice = selectedKoreanVoice;
      }

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
