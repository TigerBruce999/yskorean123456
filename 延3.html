        :root {
            --primary-color: #4a90e2;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        header {
            max-width: 1000px;
            margin: 0 auto 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #1a2a3a;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        select, input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            font-size: 14px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.15);
            border-color: var(--primary-color);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .pos-tag {
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .korean {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .chinese {
            font-size: 14px;
            color: var(--text-sub);
        }

        .stats {
            font-size: 14px;
            color: var(--text-sub);
        }
    </style>
</head>

            { unit: 10, ko: "수도", pos: "名词", zh: "首都" },
            { unit: 10, ko: "한가운데", pos: "名词", zh: "正中间" },
            { unit: 10, ko: "대표", pos: "名词", zh: "代表" },
            { unit: 10, ko: "기적", pos: "名词", zh: "奇迹" },
            { unit: 10, ko: "요지", pos: "名词", zh: "要地,重地" },
            { unit: 10, ko: "중심지", pos: "名词", zh: "中心地" }
        ];

        // 渲染页面与筛选逻辑
        const grid = document.getElementById('wordGrid');
        const unitSelect = document.getElementById('unitSelect');
        const searchInput = document.getElementById('searchInput');
        const wordCount = document.getElementById('wordCount');

        function renderWords(items) {
            grid.innerHTML = '';
            wordCount.textContent = `显示 ${items.length} 个单词`;

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>第 ${item.unit} 单元</span>
                        <span class="pos-tag">${item.pos}</span>
                    </div>
                    <div class="korean">${item.ko}</div>
                    <div class="chinese">${item.zh}</div>
                `;
                card.onclick = () => speakKorean(item.ko);
                grid.appendChild(card);
            });
        }

        function filterWords() {
            const selectedUnit = unitSelect.value;
            const searchText = searchInput.value.trim().toLowerCase();

            const filtered = vocabularyData.filter(item => {
                const matchUnit = (selectedUnit === 'all') || (item.unit.toString() === selectedUnit);
                const matchSearch = item.ko.toLowerCase().includes(searchText) || item.zh.toLowerCase().includes(searchText);
                return matchUnit && matchSearch;
            });

            renderWords(filtered);
        }

        function speakKorean(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // 剔除前缀符号，避免发音异常
                const cleanText = text.replace('~', '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85; // 稍微放慢语速以适合教学
                window.speechSynthesis.speak(utterance);
            } else {
                alert("当前浏览器不支持朗读功能，建议使用 Chrome、Safari 或 Edge。");
            }
        }

        // 初始化渲染
        filterWords();
    </script>
</body>
</html>
